            background: #2196f3;
            color: white;
            padding: 20px;
        }

        .logo {
            margin-top: 80px;
            background: white;

        }

        h1 {

        }

        button {
            display: block;
            width: 220px;
            padding: 15px;
            margin: 15px auto;
            border: none;
            border-radius: 10px;
            background: #2196f3;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #0d6efd;
        }
    </style>
</head>

<body>

    <header>
        <h2>🥛 Ray Dairy</h2>

    <br><br>
